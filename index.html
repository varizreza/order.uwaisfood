<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><meta name="description" content="Pesan produk Uwais Food secara online.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png">
<title>Uwais Food — Pesan Online</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#29231f;--muted:#81766e;--line:#eee3d9;--brand:#bd6d35;--brand2:#8c4d26;--soft:#f8eee5;--green:#21845b;--shadow:0 8px 28px #56351b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:white;font-weight:700}button.secondary{background:var(--soft);color:var(--brand2)}button.ghost{background:transparent;color:var(--brand2);padding:8px}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:980px;margin:auto;padding:0 16px 100px}.top{position:sticky;top:0;z-index:5;background:#fffaf4ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:850;letter-spacing:-.6px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px}.actions{display:flex;gap:8px}.hero{padding:25px 0 16px}.hero h1{font-size:clamp(25px,5vw,38px);line-height:1.1;margin:0 0 8px;letter-spacing:-1px}.muted{color:var(--muted)}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:white;outline:none;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.photo{width:100%;aspect-ratio:1.35;object-fit:cover;background:var(--soft);display:block}.placeholder{aspect-ratio:1.35;display:grid;place-items:center;background:var(--soft);font-size:42px}.pbody{padding:12px}.pname{font-weight:800;margin:0 0 4px}.desc{font-size:12px;color:var(--muted);min-height:30px;line-height:1.4}.price{font-weight:850;color:var(--brand2);margin:9px 0}.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.pfoot button{padding:9px 12px}.section{margin:22px 0}.section h2{font-size:19px;margin:0 0 12px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:80px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:9px}.qty button{padding:5px 10px;border-radius:9px}.total{font-size:20px;font-weight:900}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{padding:9px 12px}.tabs button.active{background:var(--brand2)}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdf9ed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6}.bottomin{width:min(980px,100%);display:flex;gap:10px}.bottom button{flex:1}.notice{padding:12px;border-radius:12px;background:#f2f8f4;color:#246548;margin:10px 0}.error{background:#fff0ed;color:#a43d2b}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--brand2);font-size:12px;font-weight:800}.payimg{max-width:220px;width:100%;display:block;margin:12px auto;border:1px solid var(--line);border-radius:12px}.modal{position:fixed;inset:0;background:#1d1712a8;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modalbox{background:var(--bg);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:18px}.close{float:right;background:var(--soft);color:var(--brand2);padding:8px 12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}}@media(max-width:360px){.grid{gap:8px}.pbody{padding:9px}.pname{font-size:14px}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">🥐 Uwais Food<small>Pesan langsung dari kami</small></div><div class="actions"><button class="secondary" onclick="openAccount()">Akun</button><button onclick="showCart()">Keranjang <span id="cartCount">0</span></button></div></div></header>
<main class="wrap">
<section class="hero"><h1>Favoritmu, siap dipesan.</h1><div class="muted" id="storeLine">Produk homemade Uwais Food.</div><input id="search" class="search" placeholder="Cari produk..." oninput="renderProducts()"></section>
<section class="section"><div class="row"><h2>Menu pilihan</h2><span class="muted" id="menuCount"></span></div><div id="products" class="grid"><div class="panel">Memuat katalog…</div></div></section>
<section id="trackSection" class="section"><h2>Lacak pesanan</h2><div class="panel"><div class="field"><label>Kode pesanan</label><input id="trackId" placeholder="Contoh: O..."></div><div class="field"><label>Nomor WhatsApp</label><input id="trackHp" inputmode="tel" placeholder="08xxxxxxxxxx"></div><button onclick="trackOrder()">Lihat status pesanan</button><div id="trackResult"></div></div></section>
</main>
<div class="bottom"><div class="bottomin"><button class="secondary" onclick="document.getElementById('trackSection').scrollIntoView({behavior:'smooth'})">Lacak pesanan</button><button onclick="showCart()">Lanjut checkout · <span id="cartBottom">0</span></button></div></div>
<div id="modalRoot"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwWcnvTcBJzY4SXIxKY30sPXj31oNapu-nIYPnQWDplQOOb5Xvb8WvT3vcZwGDhVOBpFw/exec';
let catalog={menu:[],tariffs:[],payment:{rekening:[],qrisImage:''}}, cart={}, customer=null, token=localStorage.getItem('uf_customer_token')||'', lastOrder=null;
const $=id=>document.getElementById(id), rupiah=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
async function api(action,args=[]){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args}),redirect:'follow'});const j=await res.json();if(!j.ok)throw new Error(j.error||'Permintaan gagal');return j.data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s,bad=false){const el=document.createElement('div');el.className='notice'+(bad?' error':'');el.textContent=s;document.querySelector('.wrap').prepend(el);setTimeout(()=>el.remove(),4500)}
async function init(){try{catalog=await api('customer_getCatalog');$('storeLine').textContent=catalog.storeAddress?catalog.storeName+' · '+catalog.storeAddress:catalog.storeName;renderProducts()}catch(e){$('products').innerHTML='<div class="panel">Katalog belum dapat dimuat. '+esc(e.message)+'</div>'}}
function renderProducts(){const q=$('search').value.toLowerCase();const list=catalog.menu.filter(p=>p.nama.toLowerCase().includes(q)||p.isi.toLowerCase().includes(q));$('menuCount').textContent=list.length+' produk';$('products').innerHTML=list.map((p,i)=>`<article class="product">${p.gambar?`<img class="photo" loading="lazy" src="${esc(p.gambar)}" alt="${esc(p.nama)}" onerror="this.outerHTML='<div class=placeholder>🥐</div>'">`:'<div class="placeholder">🥐</div>'}<div class="pbody"><div class="pname">${esc(p.nama)}</div><div class="desc">${esc(p.isi||'Dibuat dengan bahan pilihan')}</div><div class="price">${rupiah(p.harga)}</div><div class="pfoot"><span class="muted" style="font-size:11px">Siap dipesan</span><button onclick="addCart(${i},'${encodeURIComponent(p.nama)}')">+ Tambah</button></div></div></article>`).join('')||'<div class="panel">Produk tidak ditemukan.</div>'}
function addCart(i,n){const p=catalog.menu.find(x=>x.nama===decodeURIComponent(n));if(!p)return;cart[p.nama]=(cart[p.nama]||0)+1;updateCart()}
function updateCart(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('cartCount').textContent=n;$('cartBottom').textContent=n}
function cartRows(){return Object.entries(cart).filter(x=>x[1]>0).map(([nama,qty])=>{const p=catalog.menu.find(x=>x.nama===nama);return p?{...p,qty}:null}).filter(Boolean)}
function showCart(){const items=cartRows();if(!items.length){notify('Keranjang masih kosong.');return}modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Keranjang</h2>${items.map(p=>`<div class="cartline"><div><b>${esc(p.nama)}</b><div class="muted">${rupiah(p.harga)} / item</div></div><div class="qty"><button class="secondary" onclick="changeQty('${encodeURIComponent(p.nama)}',-1)">−</button><b>${p.qty}</b><button onclick="changeQty('${encodeURIComponent(p.nama)}',1)">+</button></div></div>`).join('')}<div class="row" style="margin:16px 0"><b>Subtotal</b><b class="total">${rupiah(items.reduce((s,p)=>s+p.qty*p.harga,0))}</b></div><button style="width:100%" onclick="checkout()">Lanjut checkout</button>`)}
function changeQty(n,d){const k=decodeURIComponent(n);cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];updateCart();showCart()}
function modal(body){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${body}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function checkout(){const items=cartRows();modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Checkout</h2><div class="tabs"><button id="guestTab" class="active" onclick="checkoutMode('guest')">Pesan sebagai tamu</button><button id="loginTab" class="secondary" onclick="checkoutMode('account')">Gunakan akun</button></div><div id="accountHint" class="muted">${customer?'Login sebagai '+esc(customer.nama):'Isi data pemesan di bawah.'}</div><div class="field"><label>Nama pemesan</label><input id="coNama" value="${esc(customer?.nama||'')}" placeholder="Nama lengkap"></div><div class="field"><label>Nomor WhatsApp</label><input id="coHp" value="${esc(customer?.hp||'')}" inputmode="tel" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Metode pengiriman</label><select id="shipMode" onchange="shipFields()"><option value="Pickup">Pickup / Ambil sendiri</option><option value="Kurir">Via Kurir</option></select></div><div id="shipExtra" class="hidden"><div class="field"><label>Daerah tarif</label><select id="shipArea" onchange="updateShipFee()"><option value="">Pilih daerah</option>${catalog.tariffs.map(t=>`<option value="${esc(t.area)}">${esc(t.area)} — ${rupiah(t.ongkir)}</option>`).join('')}</select></div><div class="field"><label>Alamat lengkap</label><textarea id="shipAddress" placeholder="Nama jalan, nomor rumah, RT/RW, patokan"></textarea></div><div class="muted" id="feeLine"></div></div><div class="field"><label>Metode pembayaran</label><select id="payMode" onchange="paymentInfo()"><option value="QRIS/Transfer">QRIS / Transfer</option><option value="COD">Bayar saat pickup / kurir (COD)</option></select></div><div id="paymentInfo" class="muted"></div><div class="field"><label>Catatan pesanan (opsional)</label><textarea id="coNote" placeholder="Contoh: tanpa kartu ucapan"></textarea></div><div class="row"><b>Total sementara</b><b id="coTotal" class="total">${rupiah(items.reduce((s,p)=>s+p.qty*p.harga,0))}</b></div><button style="width:100%;margin-top:14px" onclick="submitOrder()">Kirim pesanan</button><div id="coError"></div>`);paymentInfo()}
let coMode='guest';function checkoutMode(m){coMode=m;$('guestTab').className=m==='guest'?'':'secondary';$('loginTab').className=m==='account'?'':'secondary';if(m==='account'&&!customer){openAccount();return}if(customer){$('coNama').value=customer.nama;$('coHp').value=customer.hp}}
function shipFields(){$('shipExtra').classList.toggle('hidden',$('shipMode').value!=='Kurir');updateShipFee()}
function updateShipFee(){const t=catalog.tariffs.find(x=>x.area===$('shipArea')?.value);const fee=$('shipMode').value==='Kurir'?(t?.ongkir||0):0;$('feeLine').textContent=t?`Estimasi ongkir ${rupiah(fee)} · ${t.jarakKm} km`:'Pilih daerah yang tersedia';const sub=cartRows().reduce((s,p)=>s+p.qty*p.harga,0);$('coTotal').textContent=rupiah(sub+fee)}
function paymentInfo(){const p=catalog.payment;if($('payMode').value==='COD'){$('paymentInfo').textContent='Pembayaran dilakukan saat pesanan diambil atau diterima.';return}let s=(p.rekening||[]).map(r=>`${r.bank}: ${r.noRek} a.n. ${r.atasNama}`).join(' · ');$('paymentInfo').innerHTML=esc(s||'Informasi rekening belum tersedia.')+(p.qrisImage?`<img class="payimg" src="${p.qrisImage}" alt="QRIS Uwais Food">`:'')}
async function submitOrder(){const err=$('coError');err.textContent='';try{const hp=$('coHp').value.trim(),nama=$('coNama').value.trim();const shipping={metode:$('shipMode').value,area:$('shipArea')?.value||'',alamat:$('shipAddress')?.value||''};const items=cartRows().map(p=>({nama:p.nama,qty:p.qty}));const result=await api('customer_createOrder',[{nama,hp,items,shipping,payment:$('payMode').value,note:$('coNote').value},coMode==='account'?(token||''):'']);lastOrder={...result,hp};cart={};updateCart();closeModal();showOrderSuccess(result,hp)}catch(e){err.className='notice error';err.textContent=e.message}}
function showOrderSuccess(o,hp){modal(`<h2>Pesanan berhasil dikirim!</h2><div class="notice">Kode pesanan Anda</div><div style="font-size:24px;font-weight:900;letter-spacing:1px">${esc(o.id)}</div><p class="muted">Simpan kode ini untuk melihat status pesanan.</p><div class="row"><span>Subtotal</span><b>${rupiah(o.subtotal)}</b></div><div class="row"><span>Ongkir</span><b>${rupiah(o.ongkir)}</b></div><div class="row"><b>Total</b><b class="total">${rupiah(o.total)}</b></div><p>${o.payment==='COD'?'Pembayaran dilakukan saat menerima/mengambil pesanan.':'Silakan lakukan pembayaran QRIS/transfer, lalu unggah bukti pembayaran di bawah.'}</p>${o.payment!=='COD'?`<div class="field"><label>Unggah bukti pembayaran (JPG/PNG/WEBP, maks. 900 KB)</label><input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="secondary" onclick="uploadProof('${esc(o.id)}','${esc(hp)}')">Kirim bukti pembayaran</button><div id="proofStatus"></div></div>`:''}<button class="secondary" style="width:100%" onclick="closeModal();$('trackId').value='${esc(o.id)}';$('trackHp').value='${esc(hp)}';trackOrder()">Lacak pesanan</button><button style="width:100%;margin-top:8px" onclick="closeModal()">Selesai</button>`)}
async function uploadProof(id,hp){const f=$('proofFile')?.files?.[0],out=$('proofStatus');if(!f){out.textContent='Pilih gambar bukti pembayaran terlebih dahulu.';return}if(f.size>900*1024){out.textContent='Ukuran file maksimal 900 KB.';return}out.textContent='Mengirim bukti…';try{const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const res=await api('customer_uploadProof',[{id,hp,dataUrl}]);out.className='notice';out.textContent=res.message||'Bukti pembayaran berhasil dikirim.'}catch(e){out.className='notice error';out.textContent=e.message}}
async function uploadProof(id,hp){const f=$('proofFile')?.files?.[0],out=$('proofStatus');if(!f){out.textContent='Pilih gambar bukti pembayaran terlebih dahulu.';return}if(f.size>900*1024){out.textContent='Ukuran file maksimal 900 KB.';return}out.textContent='Mengirim bukti…';try{const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const res=await api('customer_uploadProof',[{id,hp,dataUrl}]);out.className='notice';out.textContent=res.message||'Bukti pembayaran berhasil dikirim.'}catch(e){out.className='notice error';out.textContent=e.message}}
async function trackOrder(){const out=$('trackResult');out.innerHTML='Memeriksa…';try{const o=await api('customer_lookupOrder',[{id:$('trackId').value.trim(),hp:$('trackHp').value.trim(),token:token||''}]);out.innerHTML=`<div class="panel"><div class="row"><b>Pesanan ${esc(o.id)}</b><span class="status">${esc(o.status)}</span></div><div class="muted">${esc(o.waktu)}</div>${o.items.map(p=>`<div class="row" style="padding:8px 0"><span>${p.qty} × ${esc(p.nama)}</span><b>${rupiah(p.qty*p.harga)}</b></div>`).join('')}<div class="row"><span>Ongkir</span><b>${rupiah(o.ongkir)}</b></div><div class="row"><b>Total</b><b class="total">${rupiah(o.total)}</b></div><p>Status pembayaran: <b>${esc(o.bayar)}</b> · ${esc(o.metodeBayar)}</p></div>`}catch(e){out.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function openAccount(){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Akun pelanggan</h2><div class="tabs"><button id="aLogin" onclick="accountMode('login')">Login</button><button class="secondary" id="aReg" onclick="accountMode('register')">Daftar akun</button></div><div id="regName" class="field hidden"><label>Nama</label><input id="aNama" placeholder="Nama lengkap"></div><div class="field"><label>Nomor WhatsApp</label><input id="aHp" inputmode="tel" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Kata sandi</label><input id="aPass" type="password" placeholder="Minimal 8 karakter"></div><button style="width:100%" onclick="accountSubmit()">Lanjutkan</button><div id="aError"></div>`);accountMode('login')}
let accountAction='login';function accountMode(m){accountAction=m;$('aLogin').className=m==='login'?'':'secondary';$('aReg').className=m==='register'?'':'secondary';$('regName').classList.toggle('hidden',m!=='register')}
async function accountSubmit(){const out=$('aError');try{const p={hp:$('aHp').value,nama:$('aNama')?.value||'',password:$('aPass').value};const r=await api(accountAction==='login'?'customer_login':'customer_register',[p]);token=r.token;customer=r.customer;localStorage.setItem('uf_customer_token',token);closeModal();notify('Berhasil masuk sebagai '+customer.nama)}catch(e){out.className='notice error';out.textContent=e.message}}
init();updateCart();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
