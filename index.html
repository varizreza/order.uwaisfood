(--shadow-soft)}.hero:after{content:'🥐';position:absolute;right:clamp(14px,6vw,62px);top:50%;transform:translateY(-50%) rotate(-12deg);font-size:clamp(70px,12vw,130px);opacity:.22;pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:640px}.hero-kicker{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.6);color:var(--brand-strong);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.hero h1{font:800 clamp(30px,5vw,48px)/1.06 'Plus Jakarta Sans',system-ui,sans-serif;margin:16px 0 10px;letter-spacing:-1.7px;max-width:560px}.hero .muted{font-size:14px;max-width:460px;line-height:1.55}.hero .panel{max-width:560px;margin:18px 0 14px}.search{position:relative;z-index:1;width:min(560px,100%);padding:15px 18px;border:1px solid rgba(141,68,39,.15);border-radius:999px;background:rgba(255,253,251,.94);outline:none;margin:14px 0 0;box-shadow:var(--shadow-soft)}.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(141,68,39,.12);outline:none}.muted{color:var(--muted)}.section{margin:24px 0}.section h2{font:800 22px 'Plus Jakarta Sans',system-ui,sans-serif;margin:0;letter-spacing:-.7px}.section .row{margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.product{background:var(--surface);border:1px solid rgba(231,221,213,.9);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-soft);transition:transform .2s ease,box-shadow .2s ease}.product:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo{width:100%;aspect-ratio:1.4;object-fit:cover;background:var(--surface-high);display:block}.placeholder{aspect-ratio:1.4;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-container),var(--surface-high));font-size:48px}.pbody{padding:15px}.pname{font:800 15px 'Plus Jakarta Sans',system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.4px}.desc{font-size:12px;color:var(--muted);min-height:31px;line-height:1.45}.price{font:800 17px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--brand-strong);margin:12px 0}.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.pfoot>span{font-size:11px!important}.pfoot button{min-height:42px;padding:9px 15px;border-radius:999px;font-size:12px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;margin:12px 0;box-shadow:var(--shadow-soft)}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;font-weight:800;color:#5c514a;letter-spacing:.1px}.field input,.field select,.field textarea{width:100%;min-height:50px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}.field textarea{min-height:90px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:9px}.qty button{min-height:38px;min-width:38px;padding:5px 10px;border-radius:50%;box-shadow:none}.total{font:800 22px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--brand-strong)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{min-height:42px;padding:9px 15px;border-radius:999px}.tabs button.active{background:var(--brand);color:white}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(247,243,239,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:11px max(18px,env(safe-area-inset-right)) calc(11px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6}.bottomin{width:min(1120px,100%);display:flex;gap:10px}.bottom button{flex:1;border-radius:999px;min-height:54px;font-size:14px}.notice{padding:13px 15px;border-radius:18px;background:var(--secondary-container);color:#244d3b;margin:11px 0;line-height:1.5;font-size:13px}.error{background:#f8dfdc;color:var(--danger)}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:var(--brand-container);color:var(--brand-strong);font-size:11px;font-weight:800}.payimg{max-width:220px;width:100%;display:block;margin:12px auto;border:1px solid var(--line);border-radius:20px}.modal{position:fixed;inset:0;background:rgba(27,22,19,.48);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:10px}.modalbox{background:var(--bg);width:min(600px,100%);max-height:93vh;overflow:auto;border-radius:32px 32px 20px 20px;padding:22px;box-shadow:0 24px 80px rgba(30,20,12,.22)}.modalbox h2{font:800 23px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.7px;margin:3px 0 16px}.close{float:right;background:var(--surface-high);color:var(--brand-strong);padding:8px 14px;min-height:38px;border-radius:999px;box-shadow:none}.track-heading{display:flex;align-items:center;gap:14px;margin:14px 0 18px}.track-heading h1{font:800 clamp(26px,5vw,34px) 'Plus Jakarta Sans',system-ui,sans-serif;margin:0 0 6px;letter-spacing:-1px}.track-heading>button{white-space:nowrap;min-height:42px}.track-panel{padding:20px}.track-result-card{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;background:var(--surface);box-shadow:var(--shadow-soft)}.track-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.track-actions button{width:100%;min-height:46px}.track-actions .wa-btn{grid-column:1/-1;background:#176b4a}.pay-choice{display:grid;gap:10px;margin-top:14px}.pay-instructions{border:1px solid #e5d1c3;background:var(--brand-soft);border-radius:20px;padding:14px;margin:13px 0}.pay-status-big{font:800 19px 'Plus Jakarta Sans',system-ui,sans-serif;margin:8px 0}.proof-box{border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px;background:var(--surface)}.proof-box input{width:100%;margin:8px 0}.actions .track-nav{white-space:nowrap}.shipping-block{margin:15px 0;padding:16px;background:var(--surface-low);border:1px solid var(--line);border-radius:24px}.shipping-block:before{content:'DETAIL PENGIRIMAN';display:block;font-size:10px;letter-spacing:1px;font-weight:900;color:var(--brand);margin:0 0 9px}.shipping-help{font-size:12px;line-height:1.5;color:var(--muted);padding:10px 12px;background:var(--surface);border-radius:15px}.hero .panel{border-color:rgba(141,68,39,.15);background:rgba(255,253,251,.82)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}.modalbox{border-radius:30px}}

</style></head><body>
<header class="top"><div class="topin"><div class="brand"><span class="brand-mark">🥐</span><span>Uwais Food<small>Freshly baked, made with care</small></span></div><div class="actions"><button class="secondary track-nav" onclick="showTrackPage()">Lacak</button><button class="secondary" onclick="openAccount()">Akun</button><button onclick="showCart()">Keranjang <span id="cartCount">0</span></button></div></div></header>
<main class="wrap">
<div id="homePage">
<section class="hero"><div class="hero-copy"><span class="hero-kicker">✦ Fresh from our kitchen</span><h1>Temukan camilan favoritmu.</h1><div class="muted" id="storeLine">Produk homemade Uwais Food.</div><div id="poBanner" class="panel" style="margin:14px 0 8px">Memeriksa jadwal Pre-Order…</div><input id="search" class="search" placeholder="⌕  Cari bolen, cake, dan lainnya…" oninput="renderProducts()"></div></section>
<section class="section"><div class="row"><h2>Menu pilihan</h2><span class="muted" id="menuCount"></span></div><div id="products" class="grid"><div class="panel">Memuat katalog…</div></div></section>
</div>
<section id="trackPage" class="section hidden">
  <div class="track-heading"><button class="secondary" onclick="showHomePage()">← Kembali</button><div><h1>Lacak pesanan</h1><div class="muted">Cukup masukkan nomor WhatsApp yang digunakan saat checkout untuk melihat seluruh pesanan Anda.</div></div></div>
  <div class="panel track-panel">
    <div class="field"><label>Nomor WhatsApp</label><input id="trackHp" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel"></div>
    <button onclick="trackOrder()">Cari pesanan saya</button>
    <div id="trackResult"></div>
  </div>
</section>
</main>
<div class="bottom" id="homeBottom"><div class="bottomin"><button id="checkoutBtn" onclick="showCart()" disabled>PO sedang ditutup</button></div></div>
<div id="modalRoot"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwWcnvTcBJzY4SXIxKY30sPXj31oNapu-nIYPnQWDplQOOb5Xvb8WvT3vcZwGDhVOBpFw/exec';
const CUSTOMER_WA_CONFIRM_FALLBACK = "Assalamu’alaikum Uwais Food, saya sudah membuat pesanan melalui Customer PWA.\n\n*Konfirmasi Pesanan*\nNomor: {nomor_pesanan}\nNama: {nama_pelanggan}\nWhatsApp: {whatsapp_pelanggan}\nTanggal: {tanggal}\n\n*Pesanan*\n{daftar_produk}\nSubtotal: {subtotal}\nOngkir: {ongkir}\nTotal: {total}\n\nPengiriman: {metode_pengiriman}\nPembayaran: {metode_pembayaran} — {status_pembayaran}\nStatus pesanan: {status_pesanan}\n\nMohon konfirmasi pesanan saya. Terima kasih.";
const CUSTOMER_WA_COURIER_FALLBACK = "*Detail Kurir / Pengiriman*\nJenis kurir: {jenis_kurir}\nNama layanan/kurir: {nama_kurir}\nKontak kurir: {kontak_kurir}\nDaerah tujuan: {daerah}\nAlamat tujuan: {alamat}\nCatatan pengiriman: {catatan_pengiriman}\nStatus ongkir: {status_ongkir}\nNominal ongkir: {ongkir}\n\nMohon bantu konfirmasi pilihan kurir dan biaya pengirimannya.";
let catalog={menu:[],tariffs:[],payment:{rekening:[],qrisImage:''},shippingConfig:{autoByArea:false},whatsappTemplates:{}}, cart={}, customer=null, token=localStorage.getItem('uf_customer_token')||'', lastOrder=null, trackedOrders=[];
const $=id=>document.getElementById(id), rupiah=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
function normalizeCustomerPhone(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('0062'))n=n.slice(2);if(n.startsWith('62'))n='0'+n.slice(2);else if(n.startsWith('8'))n='0'+n;return n;}
async function api(action,args=[]){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args}),redirect:'follow'});const j=await res.json();if(!j.ok)throw new Error(j.error||'Permintaan gagal');return j.data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s,bad=false){const el=document.createElement('div');el.className='notice'+(bad?' error':'');el.textContent=s;document.querySelector('.wrap').prepend(el);setTimeout(()=>el.remove(),4500)}
function poOpen(){return !!(catalog.orderAvailability&&catalog.orderAvailability.open&&catalog.orderAvailability.po)}
function fmtLocalDateTime(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v).replace('T',' '):d.toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function renderPoStatus(){const a=catalog.orderAvailability||{open:false,message:'Jadwal PO belum tersedia.'};const b=$('poBanner');if(!b)return;if(a.open&&a.po){b.innerHTML='<b>🟢 Pre-Order sedang dibuka</b><div class="muted" style="margin-top:4px">'+esc(a.po.nama)+' · Tutup '+esc(fmtLocalDateTime(a.po.tutup))+'</div><div style="font-size:12px;margin-top:5px">Silakan pilih produk dan lanjutkan pemesanan.</div>';b.style.borderColor='#b7dfc9';}else{const extra=a.next?'<div class="muted" style="margin-top:5px">PO berikutnya: '+esc(a.next.nama)+' · Mulai '+esc(fmtLocalDateTime(a.next.mulai))+'</div>':'';b.innerHTML='<b>🔒 Pemesanan sedang ditutup</b><div class="muted" style="margin-top:4px">'+esc(a.message||'Belum ada periode PO aktif.')+'</div>'+extra;b.style.borderColor='var(--line)';}const cb=$('checkoutBtn');if(cb){cb.disabled=!poOpen();cb.textContent=poOpen()?'Lanjut checkout · '+($('cartCount').textContent||'0'):'PO sedang ditutup';}}
async function init(){try{catalog=await api('customer_getCatalog');catalog.orderAvailability=catalog.orderAvailability||{open:false,message:'Jadwal PO belum tersedia.'};$('storeLine').textContent=catalog.storeAddress?catalog.storeName+' · '+catalog.storeAddress:catalog.storeName;renderPoStatus();renderProducts()}catch(e){catalog.orderAvailability={open:false,message:'Jadwal PO belum dapat diverifikasi.'};renderPoStatus();$('products').innerHTML='<div class="panel">Katalog belum dapat dimuat. '+esc(e.message)+'</div>'}}
async function refreshCatalog(){try{const fresh=await api('customer_getCatalog');catalog=fresh;catalog.shippingConfig=catalog.shippingConfig||{autoByArea:false};renderPoStatus();renderProducts()}catch(e){console.warn('Penyegaran katalog gagal',e.message)}}
function renderProducts(){const q=$('search').value.toLowerCase();const list=catalog.menu.filter(p=>p.nama.toLowerCase().includes(q)||p.isi.toLowerCase().includes(q));$('menuCount').textContent=list.length+' produk';$('products').innerHTML=list.map((p,i)=>`<article class="product">${p.gambar?`<img class="photo" loading="lazy" src="${esc(p.gambar)}" alt="${esc(p.nama)}" onerror="this.outerHTML='<div class=placeholder>🥐</div>'">`:'<div class="placeholder">🥐</div>'}<div class="pbody"><div class="pname">${esc(p.nama)}</div><div class="desc">${esc(p.isi||'Dibuat dengan bahan pilihan')}</div><div class="price">${rupiah(p.harga)}</div><div class="pfoot"><span class="muted" style="font-size:11px">${poOpen()?'Siap dipesan':'PO ditutup'}</span><button ${poOpen()?'':'disabled'} onclick="addCart(${i},'${encodeURIComponent(p.nama)}')">${poOpen()?'+ Tambah':'Tidak tersedia'}</button></div></div></article>`).join('')||'<div class="panel">Produk tidak ditemukan.</div>'}
function addCart(i,n){if(!poOpen()){notify('Pemesanan belum dibuka. Silakan cek jadwal PO.',true);return}const p=catalog.menu.find(x=>x.nama===decodeURIComponent(n));if(!p)return;cart[p.nama]=(cart[p.nama]||0)+1;updateCart()}
function updateCart(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('cartCount').textContent=n;if($('checkoutBtn')){$('checkoutBtn').disabled=!poOpen();$('checkoutBtn').textContent=poOpen()?'Lanjut checkout · '+n:'PO sedang ditutup'}}
function cartRows(){return Object.entries(cart).filter(x=>x[1]>0).map(([nama,qty])=>{const p=catalog.menu.find(x=>x.nama===nama);return p?{...p,qty}:null}).filter(Boolean)}
function showCart(){if(!poOpen()){notify('Pemesanan sedang ditutup karena tidak ada periode PO yang aktif.',true);return}const items=cartRows();if(!items.length){notify('Keranjang masih kosong.');return}modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Keranjang</h2>${items.map(p=>`<div class="cartline"><div><b>${esc(p.nama)}</b><div class="muted">${rupiah(p.harga)} / item</div></div><div class="qty"><button class="secondary" onclick="changeQty('${encodeURIComponent(p.nama)}',-1)">−</button><b>${p.qty}</b><button onclick="changeQty('${encodeURIComponent(p.nama)}',1)">+</button></div></div>`).join('')}<div class="row" style="margin:16px 0"><b>Subtotal</b><b class="total">${rupiah(items.reduce((s,p)=>s+p.qty*p.harga,0))}</b></div><button style="width:100%" onclick="checkout()">Lanjut checkout</button>`)}
function changeQty(n,d){const k=decodeURIComponent(n);cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];updateCart();showCart()}
function modal(body){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${body}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function checkout(){if(!poOpen()){notify('Periode PO sudah ditutup. Pesanan belum dapat dikirim.',true);return}const items=cartRows();modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Checkout</h2><div class="tabs"><button id="guestTab" class="active" onclick="checkoutMode('guest')">Pesan sebagai tamu</button><button id="loginTab" class="secondary" onclick="checkoutMode('account')">Gunakan akun</button></div><div id="accountHint" class="muted">${customer?'Login sebagai '+esc(customer.nama):'Isi data pemesan di bawah.'}</div><div class="field"><label>Nama pemesan</label><input id="coNama" value="${esc(customer?.nama||'')}" placeholder="Nama lengkap" autocomplete="name"></div><div class="field"><label>Nomor WhatsApp</label><input id="coHp" value="${esc(customer?.hp||'')}" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel"></div><div class="field"><label>Metode pengiriman</label><select id="shipMode" onchange="shipFields()"><option value="Pickup">Pickup / Ambil sendiri</option><option value="Kurir">Via Kurir</option></select></div><div id="shipExtra" class="shipping-block hidden"><div class="shipping-help">Alamat lengkap diperlukan agar toko dapat mengatur pengiriman. Nama dan nomor kurir boleh dilengkapi sekarang atau menyusul melalui WhatsApp.</div><div class="field"><label>Jenis kurir</label><select id="courierChoice" onchange="courierChoiceChanged()"><option value="Toko">Kurir Uwais Food</option><option value="Pihak Ketiga">Kurir pilihan saya sendiri</option></select><div class="muted" style="font-size:12px">Anda boleh menggunakan kurir Uwais Food atau mengatur kurir sendiri.</div></div><div class="field"><label>Nama kurir / layanan (opsional)</label><input id="courierName" placeholder="Contoh: GoSend, GrabExpress, kurir pribadi"></div><div class="field"><label>Nomor kontak kurir (opsional)</label><input id="courierContact" inputmode="tel" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Catatan pengiriman (opsional)</label><input id="deliveryNote" placeholder="Contoh: hubungi sebelum tiba"></div><div class="field"><label>Daerah / kecamatan (opsional)</label><input id="shipArea" placeholder="Contoh: Batu 9, Tanjungpinang" oninput="updateShipFee()"></div><div class="field"><label>Alamat lengkap tujuan kurir *</label><textarea id="shipAddress" placeholder="Nama jalan, nomor rumah, RT/RW, patokan"></textarea></div><div class="shipping-help" id="feeLine">Ongkir akan dikonfirmasi melalui WhatsApp setelah pesanan diterima.</div></div><div class="field"><label>Metode pembayaran</label><select id="payMode" onchange="paymentInfo()"><option value="QRIS/Transfer">QRIS / Transfer</option><option value="COD">Bayar saat pickup / kurir (COD)</option></select></div><div id="paymentInfo" class="muted"></div><div class="field"><label>Catatan pesanan (opsional)</label><textarea id="coNote" placeholder="Contoh: tanpa kartu ucapan"></textarea></div><div class="row"><b>Total sementara</b><b id="coTotal" class="total">${rupiah(items.reduce((s,p)=>s+p.qty*p.harga,0))}</b></div><div class="muted" id="coTotalHint" style="font-size:12px;margin-top:4px">Total belum termasuk ongkir jika memilih Via Kurir.</div><button style="width:100%;margin-top:14px" onclick="submitOrder()">Kirim pesanan</button><div id="coError"></div>`);paymentInfo()}

let coMode='guest';function checkoutMode(m){coMode=m;$('guestTab').className=m==='guest'?'':'secondary';$('loginTab').className=m==='account'?'':'secondary';if(m==='account'&&!customer){openAccount();return}if(customer){$('coNama').value=customer.nama;$('coHp').value=customer.hp}}
function shipFields(){$('shipExtra').classList.toggle('hidden',$('shipMode').value!=='Kurir');updateShipFee()}
function courierChoiceChanged(){const own=$('courierChoice')?.value==='Pihak Ketiga';const name=$('courierName');if(name)name.placeholder=own?'Nama kurir pilihan Anda (opsional)':'Nama kurir Uwais Food (opsional)';updateShipFee()}
function normalizeAreaKey(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function updateShipFee(){const area=String($('shipArea')?.value||'').trim();const t=catalog.tariffs.find(x=>normalizeAreaKey(x.area)===normalizeAreaKey(area));const automatic=!!catalog.shippingConfig?.autoByArea&&!!t&&$('courierChoice')?.value!=='Pihak Ketiga';const fee=automatic?Number(t.ongkir)||0:0;if($('feeLine'))$('feeLine').textContent=automatic?`Estimasi ongkir otomatis ${rupiah(fee)} · ${Number(t.jarakKm)||0} km. Admin akan mengonfirmasi kembali jika diperlukan.`:'Ongkir belum ditambahkan ke total. Uwais Food akan menginformasikan ongkir melalui WhatsApp. Daerah boleh dikosongkan.';const sub=cartRows().reduce((s,p)=>s+p.qty*p.harga,0);if($('coTotal'))$('coTotal').textContent=rupiah(sub+fee);if($('coTotalHint'))$('coTotalHint').textContent=automatic?'Total sementara termasuk estimasi ongkir daerah.':'Total sementara belum termasuk ongkir.'}
function pendingCheckoutKey(payload){const signature=JSON.stringify({hp:payload.hp,items:payload.items,shipping:payload.shipping,payment:payload.payment,note:payload.note});let old=null;try{old=JSON.parse(localStorage.getItem('uf_customer_pending_checkout')||'null')}catch(_){}if(old&&old.signature===signature&&old.key)return old.key;const key='UF'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);localStorage.setItem('uf_customer_pending_checkout',JSON.stringify({key,signature}));return key}
async function submitOrder(){const err=$('coError');err.textContent='';try{const hp=normalizeCustomerPhone($('coHp').value),nama=$('coNama').value.trim();$('coHp').value=hp;const shipping={metode:$('shipMode').value,area:$('shipArea')?.value||'',alamat:$('shipAddress')?.value||'',pilihanKurir:$('courierChoice')?.value||'Toko',namaKurir:$('courierName')?.value||'',kontakKurir:$('courierContact')?.value||'',catatanPengiriman:$('deliveryNote')?.value||''};const items=cartRows().map(p=>({nama:p.nama,qty:p.qty}));const body={nama,hp,items,shipping,payment:$('payMode').value,note:$('coNote').value};body.clientRequestId=pendingCheckoutKey(body);const result=await api('customer_createOrder',[body,coMode==='account'?(token||''):'']);localStorage.removeItem('uf_customer_pending_checkout');lastOrder={...result,hp,items:result.items||items};cart={};updateCart();closeModal();showOrderSuccess(result,hp)}catch(e){err.className='notice error';err.textContent=e.message}}

function showOrderSuccess(o,hp){
  const payStatus=o.payment==='COD'?'COD · Bayar saat pesanan diterima':'Belum Bayar';
  modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Pesanan berhasil dikirim!</h2><div class="notice">Pesanan Anda sudah tercatat di Uwais Food.</div><div class="muted">Kode pesanan</div><div style="font-size:24px;font-weight:900;letter-spacing:1px;margin:4px 0 12px">${esc(o.id)}</div><div class="row"><span>Subtotal</span><b>${rupiah(o.subtotal)}</b></div><div class="row"><span>Ongkir</span><b>${o.ongkirPending?'Akan dikonfirmasi via WhatsApp':rupiah(o.ongkir)}</b></div><div class="row"><b>${o.ongkirPending?'Total sementara':'Total'}</b><b class="total">${o.total==null?'Belum termasuk ongkir':rupiah(o.total)}</b></div><div class="pay-instructions"><div class="muted">Status pembayaran</div><div class="pay-status-big">${esc(payStatus)}</div><div class="muted">Anda dapat mengirim konfirmasi pesanan melalui WhatsApp dan mengelola status pembayaran.</div></div><button class="wa-btn" style="width:100%;background:#1f9d62" onclick="notifyWhatsApp('${esc(o.id)}','${esc(hp)}')">Beritahu kami di WhatsApp</button><button class="secondary" style="width:100%;margin-top:9px" onclick="openPaymentStatus('${esc(o.id)}','${esc(hp)}','${esc(o.payment)}','${esc(payStatus)}',false)">Status Bayar</button><button class="secondary" style="width:100%;margin-top:9px" onclick="goTrackOrder('${esc(o.id)}','${esc(hp)}')">Lacak pesanan</button><button class="ghost" style="width:100%;margin-top:6px" onclick="closeModal()">Selesai</button>`);
}
function goTrackOrder(id,hp){closeModal();showTrackPage();$('trackHp').value=hp||'';trackOrder()}
function paymentInstructionHtml(){const p=catalog.payment||{};const banks=(p.rekening||[]).map(r=>`<div><b>${esc(r.bank)}</b> · ${esc(r.noRek)}<br><span class="muted">a.n. ${esc(r.atasNama)}</span></div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">');return `${banks||'<div>Informasi rekening belum tersedia. Silakan hubungi Uwais Food melalui WhatsApp.</div>'}${p.qrisImage?`<img class="payimg" src="${p.qrisImage}" alt="QRIS Uwais Food">`:''}`}
function openPaymentStatus(id,hp,metode,bayar,proof){
  const isCOD=String(metode||'').toUpperCase()==='COD';
  const pending=String(bayar||'').toLowerCase().includes('verifikasi')||proof;
  const paid=['sudah bayar','lunas','terbayar'].includes(String(bayar||'').toLowerCase());
  if(isCOD){const codPaid=String(bayar||'')==='Lunas';modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="notice">Metode pembayaran: COD</div><div class="pay-status-big">${codPaid?'Lunas · dibayar saat COD':'Bayar saat pickup / pesanan diterima'}</div><p class="muted">Tidak perlu mengunggah bukti transfer untuk pesanan COD.</p><button style="width:100%;background:#1f9d62" onclick="notifyWhatsApp('${esc(id)}','${esc(hp)}')">Beritahu kami di WhatsApp</button>`);return;}
  if(String(bayar||'')==='Pembayaran Ditolak') { modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="notice error">Bukti pembayaran belum dapat diterima. Silakan unggah bukti yang benar atau hubungi Uwais Food.</div><div class="pay-status-big">Pembayaran Ditolak</div>${paymentInstructionHtml()}<button style="width:100%;margin-top:10px" onclick="showProofUpload('${esc(id)}','${esc(hp)}')">Unggah ulang bukti pembayaran</button><button class="secondary" style="width:100%;margin-top:8px" onclick="notifyWhatsApp('${esc(id)}','${esc(hp)}')">Hubungi melalui WhatsApp</button>`); return; }
  if(pending||paid){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="notice">${pending?'Bukti pembayaran sudah diterima dan sedang menunggu pemeriksaan admin.':'Pembayaran telah dikonfirmasi.'}</div><div class="pay-status-big">${pending?'Menunggu Verifikasi':esc(bayar)}</div><p class="muted">Kode pesanan: ${esc(id)}</p><button class="secondary" style="width:100%" onclick="goTrackOrder('${esc(id)}','${esc(hp)}')">Perbarui status pesanan</button>`);return;}
  modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="pay-instructions"><div class="muted">Status saat ini</div><div class="pay-status-big">Belum Bayar</div><div class="muted">Metode pembayaran: QRIS / Transfer. Pilih sesuai kondisi pembayaran Anda.</div>${paymentInstructionHtml()}</div><div class="pay-choice"><button onclick="showProofUpload('${esc(id)}','${esc(hp)}')">Saya sudah bayar · Unggah bukti</button><button class="secondary" onclick="showUnpaidWhatsApp('${esc(id)}','${esc(hp)}')">Belum bayar · Lanjut WhatsApp</button></div>`);
}
function showUnpaidWhatsApp(id,hp){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Konfirmasi Pesanan</h2><div class="notice error">Status pembayaran: Belum Bayar</div><p class="muted">Pesanan tetap tercatat. Anda bisa mengirim pesan ke Uwais Food untuk memberitahukan bahwa pesanan sudah dibuat dan pembayaran belum dilakukan.</p><button style="width:100%;background:#1f9d62" onclick="notifyWhatsApp('${esc(id)}','${esc(hp)}')">Kirim pesan WhatsApp</button><button class="secondary" style="width:100%;margin-top:9px" onclick="openPaymentStatus('${esc(id)}','${esc(hp)}','QRIS/Transfer','Belum Bayar',false)">Kembali</button>`)}
function showProofUpload(id,hp){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Unggah Bukti Pembayaran</h2><p class="muted">Pilih foto bukti transfer atau pembayaran QRIS (JPG, PNG, WEBP, maks. 900 KB).</p><div class="proof-box"><input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp"><button style="width:100%" onclick="uploadProof('${esc(id)}','${esc(hp)}')">Kirim bukti pembayaran</button><div id="proofStatus"></div></div><button class="ghost" style="width:100%;margin-top:8px" onclick="openPaymentStatus('${esc(id)}','${esc(hp)}','QRIS/Transfer','Belum Bayar',false)">Kembali</button>`)}
async function uploadProof(id,hp){const f=$('proofFile')?.files?.[0],out=$('proofStatus');if(!f){out.textContent='Pilih gambar bukti pembayaran terlebih dahulu.';return}if(f.size>900*1024){out.textContent='Ukuran file maksimal 900 KB.';return}out.textContent='Mengirim bukti…';try{const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const res=await api('customer_uploadProof',[{id,hp,dataUrl}]);out.className='notice';out.textContent=res.message||'Bukti pembayaran berhasil dikirim.';out.textContent+=' Status pembayaran: Menunggu Verifikasi.';lastTrackedOrder={...(lastTrackedOrder||{}),id,bayar:'Menunggu Verifikasi',buktiTerkirim:true};const tracked=trackedOrders.find(x=>x.id===id);if(tracked){tracked.bayar='Menunggu Verifikasi';tracked.buktiTerkirim=true;}}catch(e){out.className='notice error';out.textContent=e.message}}
function normalizeWaNumber(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
function customerWaValues(o,hp,id){
  const isCourier=String(o.shipping||o.metodeKirim||'Pickup')==='Kurir';
  const payMethod=String(o.payment||o.metodeBayar||'QRIS/Transfer');
  const payStatus=String(o.bayar|| (payMethod==='COD'?'COD · Bayar saat diterima':'Belum Bayar'));
  const items=Array.isArray(o.items)?o.items.map(x=>`• ${Number(x.qty)||1} × ${x.nama||x.item||'Produk'} — ${rupiah((Number(x.qty)||1)*(Number(x.harga)||0))}`).join('\n'):'-';
  const feePending=!!(o.ongkirPending||o.total==null);
  const subtotal=Number(o.subtotal!=null?o.subtotal:(Array.isArray(o.items)?o.items.reduce((s,x)=>s+(Number(x.qty)||1)*(Number(x.harga)||0),0):0));
  const shippingLabel=isCourier?'Via Kurir':'Pickup / ambil sendiri';
  return {
    nama_toko:catalog.storeName||'Uwais Food',nama_pelanggan:o.nama||customer?.nama||'Pelanggan',whatsapp_pelanggan:hp||o.hp||'-',
    nomor_pesanan:id||o.id||'-',tanggal:o.waktu||new Date().toLocaleString('id-ID'),daftar_produk:items||'-',subtotal:rupiah(subtotal),
    ongkir:feePending?'Menunggu konfirmasi':rupiah(o.ongkir||0),total:feePending?'Belum termasuk ongkir':rupiah(o.total),
    metode_pengiriman:shippingLabel,metode_pembayaran:payMethod,status_pembayaran:payStatus,status_pesanan:o.status||'Baru',
    jenis_kurir:o.jenisKurir==='Pihak Ketiga'?'Kurir pilihan customer':(o.jenisKurir|| (isCourier?'Kurir Uwais Food':'-')),
    nama_kurir:o.namaKurir||'Belum ditentukan',kontak_kurir:o.kontakKurir||'Belum diisi',daerah:o.daerah||o.area||'-',alamat:o.alamat||'Alamat tujuan sudah tercatat pada pesanan; customer dapat melengkapinya bila diperlukan.',
    catatan_pengiriman:o.catatanPengiriman||'Tidak ada',status_ongkir:o.ongkirStatus||o.statusOngkir||(isCourier?'Menunggu konfirmasi':'Tidak berlaku'),footer:catalog.storeFooter||'Terima kasih.'
  };
}
function applyCustomerWaTemplate(template,values){return String(template||'').replace(/\{([a-z0-9_]+)\}/gi,(m,k)=>Object.prototype.hasOwnProperty.call(values,k.toLowerCase())?String(values[k.toLowerCase()]??''):m).trim()}
function notifyWhatsApp(id,hp){
  const number=normalizeWaNumber(catalog.whatsapp);
  if(!number){notify('Nomor WhatsApp Uwais Food belum diatur pada Pengaturan → Struk → Identitas Toko.',true);return}
  const o=(lastOrder&&lastOrder.id===id)?lastOrder:(trackedOrders.find(x=>x.id===id)||(lastTrackedOrder&&lastTrackedOrder.id===id?lastTrackedOrder:null));
  const values=customerWaValues(o||{id,hp},hp,id);
  const templates=catalog.whatsappTemplates||{};
  const confirm=applyCustomerWaTemplate(templates.confirm||CUSTOMER_WA_CONFIRM_FALLBACK,values);
  const courier=values.metode_pengiriman==='Via Kurir'?applyCustomerWaTemplate(templates.courier||CUSTOMER_WA_COURIER_FALLBACK,values):'';
  const message=[confirm,courier].filter(Boolean).join('\n\n');
  const url=`https://wa.me/${number}?text=${encodeURIComponent(message)}`;
  window.open(url,'_blank','noopener');
}
let lastTrackedOrder=null;
function renderTrackedOrderCard(o,hp){
  const isCOD=String(o.metodeBayar||'').toUpperCase()==='COD';
  const statusPay=isCOD?(o.bayar==='Lunas'?'Lunas · dibayar saat COD':'COD · Bayar saat diterima'):(o.bayar||'Belum Bayar');
  const items=(o.items||[]).map(p=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${Number(p.qty)||0} × ${esc(p.nama)}</span><b>${rupiah((Number(p.qty)||0)*(Number(p.harga)||0))}</b></div>`).join('');
  return `<article class="track-result-card"><div class="row"><b>Pesanan ${esc(o.id)}</b><span class="status">${esc(o.status||'Baru')}</span></div><div class="muted" style="margin:6px 0 14px">${esc(o.waktu||'-')}</div>${items}<div class="row" style="padding-top:10px"><span>Ongkir</span><b>${o.ongkirPending||o.ongkir==null?'Menunggu konfirmasi':rupiah(o.ongkir)}</b></div><div class="row"><b>${o.ongkirPending?'Total sementara':'Total'}</b><b class="total">${o.total==null?'Belum termasuk ongkir':rupiah(o.total)}</b></div><div class="pay-instructions"><div class="muted">Status pembayaran</div><div class="pay-status-big">${esc(statusPay)}</div><div class="muted">Metode: ${esc(o.metodeBayar||'-')} · Pengiriman: ${esc(o.metodeKirim||'-')} ${o.jenisKurir==='Pihak Ketiga'?'· Kurir pilihan customer':''}${o.namaKurir?' · '+esc(o.namaKurir):''}</div>${o.kontakKurir?`<div class="muted">Kontak kurir: ${esc(o.kontakKurir)}</div>`:''}${o.catatanPengiriman?`<div class="muted">Catatan pengiriman: ${esc(o.catatanPengiriman)}</div>`:''}${o.ongkirPending?'<div class="muted" style="margin-top:6px">Ongkir akan diinformasikan melalui WhatsApp.</div>':''}</div>${o.history&&o.history.length?`<div style="margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px"><b>Riwayat pesanan</b>${o.history.map(h=>`<div class="muted" style="padding:5px 0;border-bottom:1px solid var(--line)">${esc(h.waktu)} · ${esc(h.aktivitas)}${h.status?' → '+esc(h.status):''}</div>`).join('')}</div>`:''}<div class="track-actions"><button class="wa-btn" onclick="notifyWhatsApp('${esc(o.id)}','${esc(hp)}')">Beritahu kami di WhatsApp</button><button class="secondary" onclick="openPaymentStatus('${esc(o.id)}','${esc(hp)}','${esc(o.metodeBayar)}','${esc(o.bayar)}',${o.buktiTerkirim?'true':'false'})">Status Bayar</button></div></article>`;
}
async function trackOrder(){
  const out=$('trackResult'), hp=normalizeCustomerPhone($('trackHp').value);$('trackHp').value=hp;
  if(!hp){out.innerHTML='<div class="notice error">Masukkan nomor WhatsApp yang digunakan saat checkout.</div>';return;}
  out.innerHTML='<div class="notice">Mencari semua pesanan berdasarkan nomor WhatsApp…</div>';
  try{
    const list=await api('customer_lookupOrder',[{hp}]);
    trackedOrders=Array.isArray(list)?list:[];
    trackedOrders.forEach(o=>o.hp=hp);
    lastTrackedOrder=trackedOrders[0]||null;
    if(!trackedOrders.length){out.innerHTML='<div class="notice">Belum ada pesanan yang tercatat dengan nomor WhatsApp tersebut.</div>';return;}
    out.innerHTML=`<div class="notice">Ditemukan ${trackedOrders.length} pesanan untuk nomor ${esc(hp)}. Pesanan terbaru ditampilkan lebih dahulu.</div>${trackedOrders.map(o=>renderTrackedOrderCard(o,hp)).join('')}<button class="secondary" style="width:100%;margin-top:12px" onclick="trackOrder()">Perbarui semua status</button>`;
  }catch(e){out.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}
}
function showTrackPage(){ $('homePage').classList.add('hidden');$('trackPage').classList.remove('hidden');$('homeBottom').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'}); }
function showHomePage(){ $('trackPage').classList.add('hidden');$('homePage').classList.remove('hidden');$('homeBottom').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'}); }
function openAccount(){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Akun pelanggan</h2><div class="tabs"><button id="aLogin" onclick="accountMode('login')">Login</button><button class="secondary" id="aReg" onclick="accountMode('register')">Daftar akun</button></div><div id="regName" class="field hidden"><label>Nama</label><input id="aNama" placeholder="Nama lengkap"></div><div class="field"><label>Nomor WhatsApp</label><input id="aHp" inputmode="tel" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Kata sandi</label><input id="aPass" type="password" placeholder="Minimal 8 karakter"></div><button style="width:100%" onclick="accountSubmit()">Lanjutkan</button><div id="aError"></div>`);accountMode('login')}
let accountAction='login';function accountMode(m){accountAction=m;$('aLogin').className=m==='login'?'':'secondary';$('aReg').className=m==='register'?'':'secondary';$('regName').classList.toggle('hidden',m!=='register')}
async function accountSubmit(){const out=$('aError');try{const p={hp:normalizeCustomerPhone($('aHp').value),nama:$('aNama')?.value||'',password:$('aPass').value};$('aHp').value=p.hp;const r=await api(accountAction==='login'?'customer_login':'customer_register',[p]);token=r.token;customer=r.customer;localStorage.setItem('uf_customer_token',token);closeModal();notify('Berhasil masuk sebagai '+customer.nama)}catch(e){out.className='notice error';out.textContent=e.message}}
init();updateCart();setInterval(refreshCatalog,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCatalog()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
