<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><meta name="description" content="Pesan produk Uwais Food secara online.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png">
<title>Uwais Food — Pesan Online</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#29231f;--muted:#81766e;--line:#eee3d9;--brand:#bd6d35;--brand2:#8c4d26;--soft:#f8eee5;--green:#21845b;--shadow:0 8px 28px #56351b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:white;font-weight:700}button.secondary{background:var(--soft);color:var(--brand2)}button.ghost{background:transparent;color:var(--brand2);padding:8px}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:980px;margin:auto;padding:0 16px 100px}.top{position:sticky;top:0;z-index:5;background:#fffaf4ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:850;letter-spacing:-.6px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px}.actions{display:flex;gap:8px}.hero{padding:25px 0 16px}.hero h1{font-size:clamp(25px,5vw,38px);line-height:1.1;margin:0 0 8px;letter-spacing:-1px}.muted{color:var(--muted)}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:white;outline:none;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.photo{width:100%;aspect-ratio:1.35;object-fit:cover;background:var(--soft);display:block}.placeholder{aspect-ratio:1.35;display:grid;place-items:center;background:var(--soft);font-size:42px}.pbody{padding:12px}.pname{font-weight:800;margin:0 0 4px}.desc{font-size:12px;color:var(--muted);min-height:30px;line-height:1.4}.price{font-weight:850;color:var(--brand2);margin:9px 0}.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.pfoot button{padding:9px 12px}.section{margin:22px 0}.section h2{font-size:19px;margin:0 0 12px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:80px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:9px}.qty button{padding:5px 10px;border-radius:9px}.total{font-size:20px;font-weight:900}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{padding:9px 12px}.tabs button.active{background:var(--brand2)}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdf9ed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6}.bottomin{width:min(980px,100%);display:flex;gap:10px}.bottom button{flex:1}.notice{padding:12px;border-radius:12px;background:#f2f8f4;color:#246548;margin:10px 0}.error{background:#fff0ed;color:#a43d2b}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--brand2);font-size:12px;font-weight:800}.payimg{max-width:220px;width:100%;display:block;margin:12px auto;border:1px solid var(--line);border-radius:12px}.modal{position:fixed;inset:0;background:#1d1712a8;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modalbox{background:var(--bg);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:18px}.close{float:right;background:var(--soft);color:var(--brand2);padding:8px 12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}}@media(max-width:360px){.grid{gap:8px}.pbody{padding:9px}.pname{font-size:14px}}

.track-heading{display:flex;align-items:flex-start;gap:14px;margin:14px 0 18px}.track-heading h1{font-size:clamp(25px,5vw,32px);margin:0 0 6px;letter-spacing:-.7px}.track-heading>button{white-space:nowrap}.track-panel{padding:20px}.track-result-card{margin-top:18px;border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.track-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.track-actions button{width:100%;min-height:44px}.track-actions .wa-btn{grid-column:1/-1;background:#1f9d62}.pay-choice{display:grid;gap:10px;margin-top:14px}.pay-instructions{border:1px dashed #d9b99f;background:var(--soft);border-radius:14px;padding:13px;margin:12px 0}.pay-status-big{font-size:18px;font-weight:850;margin:8px 0}.proof-box{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:14px;background:#fff}.proof-box input{width:100%;margin:8px 0}.actions .track-nav{white-space:nowrap}@media(max-width:480px){.topin{gap:7px;padding:10px 11px}.brand{font-size:17px}.brand small{font-size:10px}.actions{gap:5px}.actions button{font-size:11px;padding:9px 8px;border-radius:10px}.track-heading{display:block}.track-heading>button{margin-bottom:14px}.track-panel{padding:14px}.track-actions{grid-template-columns:1fr}.track-actions .wa-btn{grid-column:auto}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">🥐 Uwais Food<small>Pesan langsung dari kami</small></div><div class="actions"><button class="secondary track-nav" onclick="showTrackPage()">Lacak Pesanan</button><button class="secondary" onclick="openAccount()">Akun</button><button onclick="showCart()">Keranjang <span id="cartCount">0</span></button></div></div></header>
<main class="wrap">
<div id="homePage">
<section class="hero"><h1>Favoritmu, siap dipesan.</h1><div class="muted" id="storeLine">Produk homemade Uwais Food.</div><div id="poBanner" class="panel" style="margin:14px 0 8px">Memeriksa jadwal Pre-Order…</div><input id="search" class="search" placeholder="Cari produk..." oninput="renderProducts()"></section>
<section class="section"><div class="row"><h2>Menu pilihan</h2><span class="muted" id="menuCount"></span></div><div id="products" class="grid"><div class="panel">Memuat katalog…</div></div></section>
</div>
<section id="trackPage" class="section hidden">
  <div class="track-heading"><button class="secondary" onclick="showHomePage()">← Kembali</button><div><h1>Lacak pesanan</h1><div class="muted">Cukup masukkan nomor WhatsApp yang digunakan saat checkout untuk melihat seluruh pesanan Anda.</div></div></div>
  <div class="panel track-panel">
    <div class="field"><label>Nomor WhatsApp</label><input id="trackHp" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel"></div>
    <button onclick="trackOrder()">Cari pesanan saya</button>
    <div id="trackResult"></div>
  </div>
</section>
</main>
<div class="bottom" id="homeBottom"><div class="bottomin"><button id="checkoutBtn" onclick="showCart()" disabled>PO sedang ditutup</button></div></div>
<div id="modalRoot"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwWcnvTcBJzY4SXIxKY30sPXj31oNapu-nIYPnQWDplQOOb5Xvb8WvT3vcZwGDhVOBpFw/exec';
let catalog={menu:[],tariffs:[],payment:{rekening:[],qrisImage:''}}, cart={}, customer=null, token=localStorage.getItem('uf_customer_token')||'', lastOrder=null, trackedOrders=[];
const $=id=>document.getElementById(id), rupiah=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
function normalizeCustomerPhone(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('0062'))n=n.slice(2);if(n.startsWith('62'))n='0'+n.slice(2);else if(n.startsWith('8'))n='0'+n;return n;}
async function api(action,args=[]){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args}),redirect:'follow'});const j=await res.json();if(!j.ok)throw new Error(j.error||'Permintaan gagal');return j.data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s,bad=false){const el=document.createElement('div');el.className='notice'+(bad?' error':'');el.textContent=s;document.querySelector('.wrap').prepend(el);setTimeout(()=>el.remove(),4500)}
function poOpen(){return !!(catalog.orderAvailability&&catalog.orderAvailability.open&&catalog.orderAvailability.po)}
function fmtLocalDateTime(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v).replace('T',' '):d.toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function renderPoStatus(){const a=catalog.orderAvailability||{open:false,message:'Jadwal PO belum tersedia.'};const b=$('poBanner');if(!b)return;if(a.open&&a.po){b.innerHTML='<b>🟢 Pre-Order sedang dibuka</b><div class="muted" style="margin-top:4px">'+esc(a.po.nama)+' · Tutup '+esc(fmtLocalDateTime(a.po.tutup))+'</div><div style="font-size:12px;margin-top:5px">Silakan pilih produk dan lanjutkan pemesanan.</div>';b.style.borderColor='#b7dfc9';}else{const extra=a.next?'<div class="muted" style="margin-top:5px">PO berikutnya: '+esc(a.next.nama)+' · Mulai '+esc(fmtLocalDateTime(a.next.mulai))+'</div>':'';b.innerHTML='<b>🔒 Pemesanan sedang ditutup</b><div class="muted" style="margin-top:4px">'+esc(a.message||'Belum ada periode PO aktif.')+'</div>'+extra;b.style.borderColor='var(--line)';}const cb=$('checkoutBtn');if(cb){cb.disabled=!poOpen();cb.textContent=poOpen()?'Lanjut checkout · '+($('cartCount').textContent||'0'):'PO sedang ditutup';}}
async function init(){try{catalog=await api('customer_getCatalog');catalog.orderAvailability=catalog.orderAvailability||{open:false,message:'Jadwal PO belum tersedia.'};$('storeLine').textContent=catalog.storeAddress?catalog.storeName+' · '+catalog.storeAddress:catalog.storeName;renderPoStatus();renderProducts()}catch(e){catalog.orderAvailability={open:false,message:'Jadwal PO belum dapat diverifikasi.'};renderPoStatus();$('products').innerHTML='<div class="panel">Katalog belum dapat dimuat. '+esc(e.message)+'</div>'}}
async function refreshCatalog(){try{const fresh=await api('customer_getCatalog');catalog=fresh;renderPoStatus();renderProducts()}catch(e){console.warn('Penyegaran katalog gagal',e.message)}}
function renderProducts(){const q=$('search').value.toLowerCase();const list=catalog.menu.filter(p=>p.nama.toLowerCase().includes(q)||p.isi.toLowerCase().includes(q));$('menuCount').textContent=list.length+' produk';$('products').innerHTML=list.map((p,i)=>`<article class="product">${p.gambar?`<img class="photo" loading="lazy" src="${esc(p.gambar)}" alt="${esc(p.nama)}" onerror="this.outerHTML='<div class=placeholder>🥐</div>'">`:'<div class="placeholder">🥐</div>'}<div class="pbody"><div class="pname">${esc(p.nama)}</div><div class="desc">${esc(p.isi||'Dibuat dengan bahan pilihan')}</div><div class="price">${rupiah(p.harga)}</div><div class="pfoot"><span class="muted" style="font-size:11px">${poOpen()?'Siap dipesan':'PO ditutup'}</span><button ${poOpen()?'':'disabled'} onclick="addCart(${i},'${encodeURIComponent(p.nama)}')">${poOpen()?'+ Tambah':'Tidak tersedia'}</button></div></div></article>`).join('')||'<div class="panel">Produk tidak ditemukan.</div>'}
function addCart(i,n){if(!poOpen()){notify('Pemesanan belum dibuka. Silakan cek jadwal PO.',true);return}const p=catalog.menu.find(x=>x.nama===decodeURIComponent(n));if(!p)return;cart[p.nama]=(cart[p.nama]||0)+1;updateCart()}
function updateCart(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('cartCount').textContent=n;if($('checkoutBtn')){$('checkoutBtn').disabled=!poOpen();$('checkoutBtn').textContent=poOpen()?'Lanjut checkout · '+n:'PO sedang ditutup'}}
function cartRows(){return Object.entries(cart).filter(x=>x[1]>0).map(([nama,qty])=>{const p=catalog.menu.find(x=>x.nama===nama);return p?{...p,qty}:null}).filter(Boolean)}
function showCart(){if(!poOpen()){notify('Pemesanan sedang ditutup karena tidak ada periode PO yang aktif.',true);return}const items=cartRows();if(!items.length){notify('Keranjang masih kosong.');return}modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Keranjang</h2>${items.map(p=>`<div class="cartline"><div><b>${esc(p.nama)}</b><div class="muted">${rupiah(p.harga)} / item</div></div><div class="qty"><button class="secondary" onclick="changeQty('${encodeURIComponent(p.nama)}',-1)">−</button><b>${p.qty}</b><button onclick="changeQty('${encodeURIComponent(p.nama)}',1)">+</button></div></div>`).join('')}<div class="row" style="margin:16px 0"><b>Subtotal</b><b class="total">${rupiah(items.reduce((s,p)=>s+p.qty*p.harga,0))}</b></div><button style="width:100%" onclick="checkout()">Lanjut checkout</button>`)}
function changeQty(n,d){const k=decodeURIComponent(n);cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];updateCart();showCart()}
function modal(body){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${body}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function checkout(){if(!poOpen()){notify('Periode PO sudah ditutup. Pesanan belum dapat dikirim.',true);return}const items=cartRows();modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Checkout</h2><div class="tabs"><button id="guestTab" class="active" onclick="checkoutMode('guest')">Pesan sebagai tamu</button><button id="loginTab" class="secondary" onclick="checkoutMode('account')">Gunakan akun</button></div><div id="accountHint" class="muted">${customer?'Login sebagai '+esc(customer.nama):'Isi data pemesan di bawah.'}</div><div class="field"><label>Nama pemesan</label><input id="coNama" value="${esc(customer?.nama||'')}" placeholder="Nama lengkap"></div><div class="field"><label>Nomor WhatsApp</label><input id="coHp" value="${esc(customer?.hp||'')}" inputmode="tel" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Metode pengiriman</label><select id="shipMode" onchange="shipFields()"><option value="Pickup">Pickup / Ambil sendiri</option><option value="Kurir">Via Kurir</option></select></div><div id="shipExtra" class="hidden"><div class="field"><label>Daerah tarif</label><select id="shipArea" onchange="updateShipFee()"><option value="">Pilih daerah</option>${catalog.tariffs.map(t=>`<option value="${esc(t.area)}">${esc(t.area)} — ${rupiah(t.ongkir)}</option>`).join('')}</select></div><div class="field"><label>Alamat lengkap</label><textarea id="shipAddress" placeholder="Nama jalan, nomor rumah, RT/RW, patokan"></textarea></div><div class="muted" id="feeLine"></div></div><div class="field"><label>Metode pembayaran</label><select id="payMode" onchange="paymentInfo()"><option value="QRIS/Transfer">QRIS / Transfer</option><option value="COD">Bayar saat pickup / kurir (COD)</option></select></div><div id="paymentInfo" class="muted"></div><div class="field"><label>Catatan pesanan (opsional)</label><textarea id="coNote" placeholder="Contoh: tanpa kartu ucapan"></textarea></div><div class="row"><b>Total sementara</b><b id="coTotal" class="total">${rupiah(items.reduce((s,p)=>s+p.qty*p.harga,0))}</b></div><button style="width:100%;margin-top:14px" onclick="submitOrder()">Kirim pesanan</button><div id="coError"></div>`);paymentInfo()}
let coMode='guest';function checkoutMode(m){coMode=m;$('guestTab').className=m==='guest'?'':'secondary';$('loginTab').className=m==='account'?'':'secondary';if(m==='account'&&!customer){openAccount();return}if(customer){$('coNama').value=customer.nama;$('coHp').value=customer.hp}}
function shipFields(){$('shipExtra').classList.toggle('hidden',$('shipMode').value!=='Kurir');updateShipFee()}
function updateShipFee(){const t=catalog.tariffs.find(x=>x.area===$('shipArea')?.value);const fee=$('shipMode').value==='Kurir'?(t?.ongkir||0):0;$('feeLine').textContent=t?`Estimasi ongkir ${rupiah(fee)} · ${t.jarakKm} km`:'Pilih daerah yang tersedia';const sub=cartRows().reduce((s,p)=>s+p.qty*p.harga,0);$('coTotal').textContent=rupiah(sub+fee)}
function paymentInfo(){const p=catalog.payment;if($('payMode').value==='COD'){$('paymentInfo').textContent='Pembayaran dilakukan saat pesanan diambil atau diterima.';return}let s=(p.rekening||[]).map(r=>`${r.bank}: ${r.noRek} a.n. ${r.atasNama}`).join(' · ');$('paymentInfo').innerHTML=esc(s||'Informasi rekening belum tersedia.')+(p.qrisImage?`<img class="payimg" src="${p.qrisImage}" alt="QRIS Uwais Food">`:'')}
async function submitOrder(){const err=$('coError');err.textContent='';try{const hp=normalizeCustomerPhone($('coHp').value),nama=$('coNama').value.trim();$('coHp').value=hp;const shipping={metode:$('shipMode').value,area:$('shipArea')?.value||'',alamat:$('shipAddress')?.value||''};const items=cartRows().map(p=>({nama:p.nama,qty:p.qty}));const result=await api('customer_createOrder',[{nama,hp,items,shipping,payment:$('payMode').value,note:$('coNote').value},coMode==='account'?(token||''):'']);lastOrder={...result,hp};cart={};updateCart();closeModal();showOrderSuccess(result,hp)}catch(e){err.className='notice error';err.textContent=e.message}}
function showOrderSuccess(o,hp){
  const payStatus=o.payment==='COD'?'COD · Bayar saat pesanan diterima':'Belum Bayar';
  modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Pesanan berhasil dikirim!</h2><div class="notice">Pesanan Anda sudah tercatat di Uwais Food.</div><div class="muted">Kode pesanan</div><div style="font-size:24px;font-weight:900;letter-spacing:1px;margin:4px 0 12px">${esc(o.id)}</div><div class="row"><span>Subtotal</span><b>${rupiah(o.subtotal)}</b></div><div class="row"><span>Ongkir</span><b>${rupiah(o.ongkir)}</b></div><div class="row"><b>Total</b><b class="total">${rupiah(o.total)}</b></div><div class="pay-instructions"><div class="muted">Status pembayaran</div><div class="pay-status-big">${esc(payStatus)}</div><div class="muted">Anda dapat mengirim konfirmasi pesanan melalui WhatsApp dan mengelola status pembayaran.</div></div><button class="wa-btn" style="width:100%;background:#1f9d62" onclick="notifyWhatsApp('${esc(o.id)}','${esc(hp)}')">Beritahu kami di WhatsApp</button><button class="secondary" style="width:100%;margin-top:9px" onclick="openPaymentStatus('${esc(o.id)}','${esc(hp)}','${esc(o.payment)}','${esc(payStatus)}',false)">Status Bayar</button><button class="secondary" style="width:100%;margin-top:9px" onclick="goTrackOrder('${esc(o.id)}','${esc(hp)}')">Lacak pesanan</button><button class="ghost" style="width:100%;margin-top:6px" onclick="closeModal()">Selesai</button>`);
}
function goTrackOrder(id,hp){closeModal();showTrackPage();$('trackHp').value=hp||'';trackOrder()}
function paymentInstructionHtml(){const p=catalog.payment||{};const banks=(p.rekening||[]).map(r=>`<div><b>${esc(r.bank)}</b> · ${esc(r.noRek)}<br><span class="muted">a.n. ${esc(r.atasNama)}</span></div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">');return `${banks||'<div>Informasi rekening belum tersedia. Silakan hubungi Uwais Food melalui WhatsApp.</div>'}${p.qrisImage?`<img class="payimg" src="${p.qrisImage}" alt="QRIS Uwais Food">`:''}`}
function openPaymentStatus(id,hp,metode,bayar,proof){
  const isCOD=String(metode||'').toUpperCase()==='COD';
  const pending=String(bayar||'').toLowerCase().includes('verifikasi')||proof;
  const paid=['sudah bayar','lunas','terbayar'].includes(String(bayar||'').toLowerCase());
  if(isCOD){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="notice">Metode pembayaran: COD</div><div class="pay-status-big">Bayar saat pickup / pesanan diterima</div><p class="muted">Tidak perlu mengunggah bukti transfer untuk pesanan COD.</p><button style="width:100%;background:#1f9d62" onclick="notifyWhatsApp('${esc(id)}','${esc(hp)}')">Beritahu kami di WhatsApp</button>`);return;}
  if(pending||paid){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="notice">${pending?'Bukti pembayaran sudah diterima dan sedang menunggu pemeriksaan admin.':'Pembayaran telah dikonfirmasi.'}</div><div class="pay-status-big">${pending?'Menunggu Verifikasi':esc(bayar)}</div><p class="muted">Kode pesanan: ${esc(id)}</p><button class="secondary" style="width:100%" onclick="goTrackOrder('${esc(id)}','${esc(hp)}')">Perbarui status pesanan</button>`);return;}
  modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Status Bayar</h2><div class="pay-instructions"><div class="muted">Status saat ini</div><div class="pay-status-big">Belum Bayar</div><div class="muted">Metode pembayaran: QRIS / Transfer. Pilih sesuai kondisi pembayaran Anda.</div>${paymentInstructionHtml()}</div><div class="pay-choice"><button onclick="showProofUpload('${esc(id)}','${esc(hp)}')">Saya sudah bayar · Unggah bukti</button><button class="secondary" onclick="showUnpaidWhatsApp('${esc(id)}','${esc(hp)}')">Belum bayar · Lanjut WhatsApp</button></div>`);
}
function showUnpaidWhatsApp(id,hp){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Konfirmasi Pesanan</h2><div class="notice error">Status pembayaran: Belum Bayar</div><p class="muted">Pesanan tetap tercatat. Anda bisa mengirim pesan ke Uwais Food untuk memberitahukan bahwa pesanan sudah dibuat dan pembayaran belum dilakukan.</p><button style="width:100%;background:#1f9d62" onclick="notifyWhatsApp('${esc(id)}','${esc(hp)}')">Kirim pesan WhatsApp</button><button class="secondary" style="width:100%;margin-top:9px" onclick="openPaymentStatus('${esc(id)}','${esc(hp)}','QRIS/Transfer','Belum Bayar',false)">Kembali</button>`)}
function showProofUpload(id,hp){modal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Unggah Bukti Pembayaran</h2><p class="muted">Pilih foto bukti transfer atau pembayaran QRIS (JPG, PNG, WEBP, maks. 900 KB).</p><div class="proof-box"><input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp"><button style="width:100%" onclick="uploadProof('${esc(id)}','${esc(hp)}')">Kirim bukti pembayaran</button><div id="proofStatus"></div></div><button class="ghost" style="width:100%;margin-top:8px" onclick="openPaymentStatus('${esc(id)}','${esc(hp)}','QRIS/Transfer','Belum Bayar',false)">Kembali</button>`)}
async function uploadProof(id,hp){const f=$('proofFile')?.files?.[0],out=$('proofStatus');if(!f){out.textContent='Pilih gambar bukti pembayaran terlebih dahulu.';return}if(f.size>900*1024){out.textContent='Ukuran file maksimal 900 KB.';return}out.textContent='Mengirim bukti…';try{const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const res=await api('customer_uploadProof',[{id,hp,dataUrl}]);out.className='notice';out.textContent=res.message||'Bukti pembayaran berhasil dikirim.';out.textContent+=' Status pembayaran: Menunggu Verifikasi.';lastTrackedOrder={...(lastTrackedOrder||{}),id,bayar:'Menunggu Verifikasi',buktiTerkirim:true};const tracked=trackedOrders.find(x=>x.id===id);if(tracked){tracked.bayar='Menunggu Verifikasi';tracked.buktiTerkirim=true;}}catch(e){out.className='notice error';out.textContent=e.message}}
function normalizeWaNumber(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
function notifyWhatsApp(id,hp){const number=normalizeWaNumber(catalog.whatsapp);if(!number){notify('Nomor WhatsApp Uwais Food belum diatur pada Pengaturan Aplikasi.',true);return}const o=(lastOrder&&lastOrder.id===id)?lastOrder:(trackedOrders.find(x=>x.id===id)||(lastTrackedOrder&&lastTrackedOrder.id===id?lastTrackedOrder:null));const payment=(o&&o.bayar)||(o&&o.payment==='COD'?'COD · Bayar saat terima':'Belum Bayar');const itemText=o&&o.items?o.items.map(x=>`${x.qty||1}x ${x.nama}`).join(', '):'Mohon bantu cek detail pesanan saya';const total=o&&o.total?rupiah(o.total):'tertera pada detail pesanan';const message=`Assalamu’alaikum Uwais Food, saya sudah membuat pesanan melalui Customer PWA.\n\nKode pesanan: ${id}\nNomor WhatsApp: ${hp}\nPesanan: ${itemText}\nTotal: ${total}\nStatus pembayaran: ${payment}\n\nMohon konfirmasi pesanan saya. Terima kasih.`;const url=`https://wa.me/${number}?text=${encodeURIComponent(message)}`;window.open(url,'_blank','noopener');}
let lastTrackedOrder=null;
function renderTrackedOrderCard(o,hp){
  const isCOD=String(o.metodeBayar||'').toUpperCase()==='COD';
  const statusPay=isCOD?'COD · Bayar saat diterima':(o.bayar||'Belum Bayar');
  const items=(o.items||[]).map(p=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${Number(p.qty)||0} × ${esc(p.nama)}</span><b>${rupiah((Number(p.qty)||0)*(Number(p.harga)||0))}</b></div>`).join('');
  return `<article class="track-result-card"><div class="row"><b>Pesanan ${esc(o.id)}</b><span class="status">${esc(o.status||'Baru')}</span></div><div class="muted" style="margin:6px 0 14px">${esc(o.waktu||'-')}</div>${items}<div class="row" style="padding-top:10px"><span>Ongkir</span><b>${o.ongkir==null?'Menunggu konfirmasi':rupiah(o.ongkir)}</b></div><div class="row"><b>Total</b><b class="total">${o.total==null?'Menunggu konfirmasi':rupiah(o.total)}</b></div><div class="pay-instructions"><div class="muted">Status pembayaran</div><div class="pay-status-big">${esc(statusPay)}</div><div class="muted">Metode: ${esc(o.metodeBayar||'-')} · Pengiriman: ${esc(o.metodeKirim||'-')}</div></div><div class="track-actions"><button class="wa-btn" onclick="notifyWhatsApp('${esc(o.id)}','${esc(hp)}')">Beritahu kami di WhatsApp</button><button class="secondary" onclick="openPaymentStatus('${esc(o.id)}','${esc(hp)}','${esc(o.metodeBayar)}','${esc(o.bayar)}',${o.buktiTerkirim?'true':'false'})">Status Bayar</button></div></article>`;
}
async function trackOrder(){
  const out=$('trackResult'), hp=normalizeCustomerPhone($('trackHp').value);$('trackHp').value=hp;
  if(!hp){out.innerHTML='<div class="notice error">Masukkan nomor WhatsApp yang digunakan saat checkout.</div>';return;}
  out.innerHTML='<div class="notice">Mencari semua pesanan berdasarkan nomor WhatsApp…</div>';
  try{
    const list=await api('customer_lookupOrder',[{hp}]);
    trackedOrders=Array.isArray(list)?list:[];
    trackedOrders.forEach(o=>o.hp=hp);
    lastTrackedOrder=trackedOrders[0]||null;
    if(!trackedOrders.length){out.innerHTML='<div class="notice">Belum ada pesanan yang tercatat dengan nomor WhatsApp tersebut.</div>';return;}
    out.innerHTML=`<div class="notice">Ditemukan ${trackedOrders.length} pesanan untuk nomor ${esc(hp)}. Pesanan terbaru ditampilkan lebih dahulu.</div>${trackedOrders.map(o=>renderTrackedOrderCard(o,hp)).join('')}<button class="secondary" style="width:100%;margin-top:12px" onclick="trackOrder()">Perbarui semua status</button>`;
  }catch(e){out.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}
}
